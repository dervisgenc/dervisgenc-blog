# blog.dervisgenc.com — the Next.js frontend and, under /api/, the Go API,
# both running in Docker on loopback (see compose.yaml and .env).
# Traffic arrives over HTTPS at Cloudflare and reaches this server through
# the local cloudflared tunnel as plain HTTP on port 80.

upstream blog_api {
    server 127.0.0.1:7100;
    keepalive 16;
}

upstream blog_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.dervisgenc.com;

    # Every request comes from cloudflared on loopback; use the visitor's
    # address from Cloudflare for logs and for the API.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/blog.dervisgenc.com.access.log;
    error_log  /var/log/nginx/blog.dervisgenc.com.error.log;

    # Image uploads are limited to 10 MB by the API.
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # Replace, never append, the client address headers so visitors cannot
    # spoof them.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location /api/ {
        proxy_pass http://blog_api;
    }

    location / {
        proxy_pass http://blog_web;
    }
}
