# dervisgenc.com — the static about site, built from about/ with
# `make deploy-about`. Traffic arrives from the local cloudflared tunnel.

server {
    listen 80;
    listen [::]:80;
    server_name dervisgenc.com www.dervisgenc.com;

    root /var/www/dervisgenc.com;
    index index.html;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/dervisgenc.com.access.log;
    error_log  /var/log/nginx/dervisgenc.com.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Next.js emits content-hashed file names under /_next/static.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
